[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellquant-datoviz"
version = "0.1.0"
authors = [
  { name="CellQuant Team" },
]
description = "A dedicated Datoviz/Vulkan rendering backend adapter for CellQuant."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    # "datoviz" # Will be added once tested
]

[project.urls]
"Homepage" = "https://github.com/yourorg/cellquant-datoviz"
